[package]
name = "manager777-tauri"
version = "0.12.0"
edition = "2021"
default-run = "777Codex"

[[bin]]
name = "777Codex"
path = "src/main.rs"

[[bin]]
name = "777-native"
path = "src/native.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.16"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Security_Cryptography","Win32_Foundation","Win32_UI_Shell","Win32_System_Com"]}

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
aes-gcm = "0.10"
fs2 = "0.4"
