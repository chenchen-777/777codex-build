name: Build macOS public beta packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned ZIP worker dependencies
        run: npm ci --prefix tauri/backend/components/share-zip --ignore-scripts --no-audit --no-fund
      - name: Restore reviewed runtime dependencies
        run: |
          mkdir -p tauri/backend/node_modules/@iarna tauri/backend/components/tool-doctor/node_modules
          cp -R node_modules/@iarna/toml tauri/backend/node_modules/@iarna/
          cp -R node_modules/yaml tauri/backend/node_modules/
          cp -R tauri/vendor/smol-toml tauri/backend/components/tool-doctor/node_modules/
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Runtime unit tests
        run: node --test tauri/test/*.test.mjs tauri/backend/test/*.test.mjs
      - name: Build and test pinned Codex++ core
        run: |
          cargo test --locked --manifest-path tauri/codexpp-engine/Cargo.toml
          cargo build --release --locked --manifest-path tauri/codexpp-engine/Cargo.toml
      # Real official-app installation and feature acceptance are performed
      # manually by the owner. Packaging still runs the isolated native smoke.
      - name: Build and launch Tauri app, verify Keychain and architecture
        run: node tauri/scripts/package-mac.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-tauri-${{ matrix.arch }}
          path: dist-mac-tauri/*
          if-no-files-found: error
          retention-days: 14
