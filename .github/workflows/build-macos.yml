name: Build macOS Tauri test packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Runtime unit tests
        run: node --test tauri/test/*.test.mjs tauri/backend/test/*.test.mjs
      - name: Build and launch Tauri app, verify Keychain and architecture
        run: node tauri/scripts/package-mac.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-tauri-${{ matrix.arch }}
          path: dist-mac-tauri/*
          if-no-files-found: error
          retention-days: 14
